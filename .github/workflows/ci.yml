name: CI

# Builds and runs the tests on every pull request, on pushes to main, and by hand on any branch (workflow_dispatch).
# Docs and captures don't trigger a pull request run.
on:
  pull_request:
    paths-ignore: ['*.md', 'docs/**', 'captures/**']
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: nothing here writes to the repo. Every action is pinned to a commit SHA (the version is in the trailing
# comment).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pylon

      # Pylon builds against Postern.Client from source (D4 in docs/implementation-plan.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArcticGizmo/postern
          persist-credentials: false
          path: postern

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: pylon/global.json

      - name: Build
        working-directory: pylon
        run: dotnet build pylon.slnx -c Release -p:PosternRoot=${{ github.workspace }}\postern\

      - name: Test
        working-directory: pylon
        run: dotnet test pylon.slnx -c Release --no-build -p:PosternRoot=${{ github.workspace }}\postern\ --blame-hang-timeout 10m --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: pylon/TestResults/
          if-no-files-found: ignore
